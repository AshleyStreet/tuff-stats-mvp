services:
  - type: web
    name: afterwhistle
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run install:all && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: TUFF_STATS_URL
        value: https://www.playtuff.ca/list/2026-tuff-stats/
      - key: ADMIN_TOKEN
        sync: false

  # Pings the web service so free-tier instances stay warm.
  - type: cron
    name: afterwhistle-keepalive
    runtime: node
    plan: free
    schedule: "*/12 * * * *"
    buildCommand: echo "keepalive"
    startCommand: node scripts/keepalive.mjs
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: KEEPALIVE_URL
        fromService:
          name: afterwhistle
          type: web
          envVarKey: RENDER_EXTERNAL_URL
