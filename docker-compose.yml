services:
  app:
    # Built and pushed by .github/workflows/build-image.yml — the instance only
    # ever pulls it. Compiling on the 1 GB box exhausted its memory badly enough
    # that sshd could not fork, so nothing here should reintroduce a build.
    #
    # Roll back by pinning a commit sha in deploy/lightsail/.env:
    #   APP_IMAGE=ghcr.io/ashleystreet/tuff-stats-mvp:<sha>
    # Build locally instead:
    #   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
    image: ${APP_IMAGE:-ghcr.io/ashleystreet/tuff-stats-mvp:latest}
    restart: unless-stopped
    expose:
      - "4000"
    env_file:
      - path: deploy/lightsail/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: "4000"
      TRUST_PROXY: "1"
      CACHE_DIR: /app/server/.cache
      TENANTS_DIR: /app/server/.tenants
    volumes:
      - tuff-cache:/app/server/.cache
      - tuff-tenants:/app/server/.tenants
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - path: deploy/lightsail/.env
        required: false
    volumes:
      - ./deploy/lightsail/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  tuff-cache:
  tuff-tenants:
  caddy-data:
  caddy-config:
