# Local source builds. Deliberately NOT named docker-compose.override.yml —
# Compose auto-loads that name, and the instance git-pulls this repo, so an
# override file would silently put the build back on the 1 GB box.
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Production pulls the prebuilt image instead; see .github/workflows/build-image.yml.
services:
  app:
    build:
      context: .
      args:
        VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID:-}
        VITE_PLAUSIBLE_DOMAIN: ${VITE_PLAUSIBLE_DOMAIN:-}
        VITE_PLAUSIBLE_SCRIPT_SRC: ${VITE_PLAUSIBLE_SCRIPT_SRC:-}
    image: afterwhistle:local
